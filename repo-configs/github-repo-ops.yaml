description: "Terraform-managed GitHub repository operations"
private: false
visibility: "public"
auto_init: false
branch_protection:
  pattern: "main"
  required_status_checks:
    strict: true
    contexts:
      - "Terraform CI / Format and validate (pull_request)"
      - "Terraform CI / Terraform plan (pull_request)"
  required_pull_request_reviews:
    required_approving_review_count: 1
