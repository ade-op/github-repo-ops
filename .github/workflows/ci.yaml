name: Terraform CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/config

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML validator dependency
        working-directory: .
        run: python -m pip install pyyaml

      - name: Validate repository YAML files
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config_dir = Path("repo-configs")
          allowed = {
              "description", "private", "visibility", "homepage",
              "auto_init", "topics", "branch_protection",
          }
          paths = sorted(config_dir.glob("*.yaml"))

          if not paths:
              raise SystemExit(f"No YAML files found in {config_dir}")

          for path in paths:
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as error:
                  raise SystemExit(f"{path}: invalid YAML: {error}") from error

              def fail(message):
                  raise SystemExit(f"{path}: {message}")

              if not isinstance(data, dict):
                  fail("must contain a YAML object")

              unknown = set(data) - allowed
              if unknown:
                  fail(f"unknown field(s): {', '.join(sorted(unknown))}")

              for field in ("description", "homepage"):
                  if field in data and not isinstance(data[field], str):
                      fail(f"{field} must be a string")

              for field in ("private", "auto_init"):
                  if field in data and not isinstance(data[field], bool):
                      fail(f"{field} must be true or false")

              if data.get("visibility") not in {None, "public", "private", "internal"}:
                  fail("visibility must be public, private, or internal")

              if "topics" in data and (
                  not isinstance(data["topics"], list)
                  or not all(isinstance(topic, str) for topic in data["topics"])
              ):
                  fail("topics must be a list of strings")

              if "branch_protection" in data:
                  protection = data["branch_protection"]
                  if not isinstance(protection, dict):
                      fail("branch_protection must be an object")

                  protection_allowed = {
                      "pattern", "required_status_checks",
                      "required_pull_request_reviews",
                  }
                  unknown = set(protection) - protection_allowed
                  if unknown:
                      fail(
                          "branch_protection has unknown field(s): "
                          + ", ".join(sorted(unknown))
                      )

                  if "pattern" in protection and not isinstance(protection["pattern"], str):
                      fail("branch_protection.pattern must be a string")

                  checks = protection.get("required_status_checks")
                  if checks is not None:
                      if not isinstance(checks, dict):
                          fail("branch_protection.required_status_checks must be an object")
                      unknown = set(checks) - {"strict", "contexts"}
                      if unknown:
                          fail(
                              "required_status_checks has unknown field(s): "
                              + ", ".join(sorted(unknown))
                          )
                      if "strict" in checks and not isinstance(checks["strict"], bool):
                          fail("required_status_checks.strict must be true or false")
                      if "contexts" in checks and (
                          not isinstance(checks["contexts"], list)
                          or not all(isinstance(context, str) for context in checks["contexts"])
                      ):
                          fail("required_status_checks.contexts must be a list of strings")

                  reviews = protection.get("required_pull_request_reviews")
                  if reviews is not None:
                      if not isinstance(reviews, dict):
                          fail("branch_protection.required_pull_request_reviews must be an object")
                      unknown = set(reviews) - {"required_approving_review_count"}
                      if unknown:
                          fail(
                              "required_pull_request_reviews has unknown field(s): "
                              + ", ".join(sorted(unknown))
                          )
                      count = reviews.get("required_approving_review_count")
                      if count is not None and (
                          isinstance(count, bool) or not isinstance(count, int) or count < 0
                      ):
                          fail("required_approving_review_count must be a non-negative integer")

              if "private" in data and "visibility" in data:
                  expected = "private" if data["private"] else "public"
                  if data["visibility"] != expected:
                      fail("private and visibility must describe the same visibility")

              print(f"validated {path}")
          PY

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: terraform/config
    env:
      TF_VAR_github_token: ${{ secrets.GH_PAT }}
      TF_VAR_github_owner: ${{ vars.REPOSITORY_OWNER }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create Terraform plan
        run: | 
          set -o pipefail
          terraform plan -input=false -no-color 2>&1 | tee plan.txt
          {
            echo "## Terraform Plan"
            echo
            echo '```text'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
