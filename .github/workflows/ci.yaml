name: Terraform CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/config

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML validator dependency
        working-directory: .
        run: python -m pip install pyyaml

      - name: Validate repository YAML files
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config_dir = Path("terraform/repo-configs")
          allowed = {
              "description", "private", "visibility", "homepage",
              "auto_init", "topics",
          }
          paths = sorted(config_dir.glob("*.yaml"))

          if not paths:
              raise SystemExit(f"No YAML files found in {config_dir}")

          for path in paths:
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as error:
                  raise SystemExit(f"{path}: invalid YAML: {error}") from error

              def fail(message):
                  raise SystemExit(f"{path}: {message}")

              if not isinstance(data, dict):
                  fail("must contain a YAML object")

              unknown = set(data) - allowed
              if unknown:
                  fail(f"unknown field(s): {', '.join(sorted(unknown))}")

              for field in ("description", "homepage"):
                  if field in data and not isinstance(data[field], str):
                      fail(f"{field} must be a string")

              for field in ("private", "auto_init"):
                  if field in data and not isinstance(data[field], bool):
                      fail(f"{field} must be true or false")

              if data.get("visibility") not in {None, "public", "private", "internal"}:
                  fail("visibility must be public, private, or internal")

              if "topics" in data and (
                  not isinstance(data["topics"], list)
                  or not all(isinstance(topic, str) for topic in data["topics"])
              ):
                  fail("topics must be a list of strings")

              if "private" in data and "visibility" in data:
                  expected = "private" if data["private"] else "public"
                  if data["visibility"] != expected:
                      fail("private and visibility must describe the same visibility")

              print(f"validated {path}")
          PY

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: terraform/config
    env:
      TF_VAR_github_token: ${{ secrets.GH_PAT }}
      TF_VAR_github_owner: ${{ vars.REPOSITORY_OWNER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create Terraform plan
        run: terraform plan -input=false -no-color
